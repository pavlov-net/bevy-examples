[workspace]
resolver = "3"
members = ["examples/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
# These examples track Bevy's `main` branch rather than a published release, so they can
# use engine features before they ship. Run `cargo update -p bevy` to move to a newer
# `main`; `Cargo.lock` is committed so a checkout builds against a known-good commit.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main" }

argh = "0.1.12"

# Bevy's lint set, with the contributor-only lints (`std_instead_of_core` and friends)
# relaxed. These are opt-in: a crate gets them by adding `[lints] workspace = true`.
# `zero_day` does not, matching Bevy's own `examples/large_scenes/*` crates -- `doc_markdown`
# fights with `argh`, whose doc comments are the `--help` text, where backticks would show
# up verbatim.
[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

too_long_first_doc_paragraph = "allow"

std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
alloc_instead_of_core = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

# Debug builds of a path tracer are unusably slow, so optimize dependencies even in `dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.stress-test]
inherits = "release"
lto = "fat"
panic = "abort"
